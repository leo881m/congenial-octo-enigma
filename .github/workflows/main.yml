name: Pipeline Integrado - 5 Etapas

on:
  push:
    branches: [ "main" ]

jobs:
  # 1. TESTE
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install fastapi uvicorn pydantic pytest pytest-asyncio httpx

      - name: Rodar testes
        run: |
          python -m pytest tests/test.py

  # 2. ENTREGA
  delivery:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Gerar artefato
        uses: actions/upload-artifact@v4
        with:
          name: projetozipado
          path: src/main.py

  # 3. DOCKER
  docker:
    needs: delivery
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/congenial-octo-enigma:latest

  # 4. DEPLOY
  deploy:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Simular deploy
        run: echo "Deploy executado com sucesso 🚀"

  # 5. DISCORD
  discord:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Notificar Discord
        uses: sniddl/discord-commits@v1.6
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          template: "🚀 Pipeline finalizado com sucesso!"
          include_author: true
