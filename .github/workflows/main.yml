name: Pipeline Integrado - 5 Etapas

on:
  push:
    branches: [ "main" ]

jobs:
  # 1ª ETAPA: TESTE (Ajustado para pasta teste/)
  teste:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: . # Permite que o teste enxergue a pasta src
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: |
          pip install fastapi uvicorn pydantic pytest pytest-asyncio httpx
      - name: Rodar Testes
        run: pytest teste/test.py  # Caminho correto para o arquivo

  # 2ª ETAPA: ENTREGA (Artefato)
  entrega:
    needs: teste
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar artefato
        uses: actions/upload-artifact@v4
        with:
          name: projetozipado
          path: src/main.py

  # 3ª ETAPA: DOCKER (Build e Push)
  docker:
    needs: entrega
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: "leomendes881"
          password: "dckr_pat_oyCwAkxN6KoUwd4rKCh_5ivLxHU"
      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/congenial-octo-enigma:latest
  # 4ª ETAPA: IMPLANTAR (Deploy)
  implantar:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Simular Deploy
        run: echo "Executando deploy da aplicação..."

  # 5ª ETAPA: DISCÓRDIA (Notificação)
  discord:
    needs: implantar
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notificar no Discord
        uses: sniddl/discord-commits@v1.6
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }} 
          template: "Pipeline concluído! Status final: ${{ job.status }}"
